x-python-service-hardening: &python-service-hardening
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  llm-backend:
    <<: *python-service-hardening
    build:
      context: .
      dockerfile: examples/llm-backend/Dockerfile
      args:
        PYTHON_BUILD_IMAGE: ${PYTHON_BUILD_IMAGE:-dhi.io/python:3.13-debian13-dev@sha256:ea5fd1cae2463b48c7627577584e582ce3d6d99ba3789723051df9a707f658b0}
        PYTHON_RUNTIME_IMAGE: ${PYTHON_RUNTIME_IMAGE:-dhi.io/python:3.13-debian13@sha256:1fe1883f0c28d90b7364e6f069437801c9e8f150c886f02f74bfcefc9ea14591}
        APP_UID: ${APP_UID:-65532}
        APP_GID: ${APP_GID:-65532}
    image: apim-simulator-llm-backend:latest
    expose:
      - "8000"
    environment:
      OTEL_SERVICE_NAME: llm-backend
      MOCK_LLM_LATENCY_MS: ${MOCK_LLM_LATENCY_MS:-0}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s
    networks:
      - apim

  llm-backend-b:
    <<: *python-service-hardening
    build:
      context: .
      dockerfile: examples/llm-backend/Dockerfile
      args:
        PYTHON_BUILD_IMAGE: ${PYTHON_BUILD_IMAGE:-dhi.io/python:3.13-debian13-dev@sha256:ea5fd1cae2463b48c7627577584e582ce3d6d99ba3789723051df9a707f658b0}
        PYTHON_RUNTIME_IMAGE: ${PYTHON_RUNTIME_IMAGE:-dhi.io/python:3.13-debian13@sha256:1fe1883f0c28d90b7364e6f069437801c9e8f150c886f02f74bfcefc9ea14591}
        APP_UID: ${APP_UID:-65532}
        APP_GID: ${APP_GID:-65532}
    image: apim-simulator-llm-backend:latest
    expose:
      - "8000"
    environment:
      OTEL_SERVICE_NAME: llm-backend-b
      MOCK_LLM_LATENCY_MS: ${MOCK_LLM_LATENCY_MS:-0}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s
    networks:
      - apim

  apim-simulator:
    environment:
      APIM_CONFIG_PATH: /tmp/ai-apim-config.json
      APIM_CONFIG_SOURCE_PATH: ${AI_APIM_CONFIG_PATH:-/app/examples/ai-gateway/apim.json}
      OTEL_SERVICE_NAME: apim-simulator
    depends_on:
      llm-backend:
        condition: service_healthy
      llm-backend-b:
        condition: service_healthy

networks:
  apim:
