[project]
name = "apim-simulator"
version = "0.4.0"
description = "Config-driven Azure API Management simulator for local Docker-first testing"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "defusedxml>=0.7.1",
    "httpx>=0.28.1",
    "pyyaml>=6.0.2",
    "pyjwt[crypto]>=2.10.1",
    "uvicorn>=0.34.0",
    "opentelemetry-api>=1.40.0",
    "opentelemetry-sdk>=1.40.0",
    "opentelemetry-exporter-otlp-proto-http>=1.40.0",
    "opentelemetry-instrumentation-fastapi>=0.61b0",
    "opentelemetry-instrumentation-httpx>=0.61b0",
    "opentelemetry-instrumentation-logging>=0.61b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "coverage[toml]>=7.6.0",
    "diff-cover>=9.2.0",
    "ruff>=0.8.0",
    "mutmut>=3.2.0",
]
mcp = [
    "mcp==1.26.0",
]

[project.scripts]
apimsim = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "contract(*ids): associates a test with one or more contract ids from contracts/contract_matrix.yml",
    "integration: requires external services (e.g. Keycloak) running",
    "repo: asserts on repository artifacts (Dockerfile, catalog, packaging) rather than on app behaviour",
]

[tool.coverage.run]
branch = true
source = ["app"]
relative_files = true

[tool.coverage.report]
# A ratchet, like the complexity gate. It sat at 75 while the suite measured 82,
# which means seven points of coverage could be lost without anything failing.
# Raise it as coverage rises; never lower it to admit a regression.
fail_under = 82
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 120
target-version = "py313"
# mutmut writes deliberately-mutated copies of app/ here. Linting them reports
# hundreds of findings about code nobody wrote.
extend-exclude = ["mutants"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "C901"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
# A ratchet that has reached its target. A function scoring 14 is telling you it
# holds fourteen paths a reader has to keep straight, and that a name is hiding
# in there; 8 is the point at which that stops being true. This number only ever
# goes down -- never raise it to admit a new function. Route-registration
# builders carry a scoped noqa instead; see docs/complexity.md for why.
max-complexity = 8

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mutmut]
source_paths = ["app"]

# The suite reads fixtures from these directories by repo-root-relative path.
# mutmut executes inside a `mutants/` copy, so anything not copied here fails
# collection before a single mutant is scored.
also_copy = ["contracts", "scripts", "examples"]

# Integration tests need Keycloak on the network. They skip, so they can kill
# no mutant while still costing collection time on every one of them.
pytest_add_cli_args = ["-p", "no:cacheprovider", "-m", "not integration and not repo"]
