pre-commit:
  parallel: true
  commands:
    ruff:
      glob: "*.py"
      run: scripts/hooks/check-staged-python.sh --execute {staged_files}
    shellcheck:
      glob: "*.sh"
      run: scripts/hooks/check-staged-shell.sh --execute {staged_files}
    yamllint:
      glob: "*.{yaml,yml}"
      run: scripts/hooks/check-staged-yaml.sh --execute {staged_files}

# A script, not a command: lefthook skips pre-push commands and jobs when it
# finds no "push files", which happens for any push of a branch that is not
# checked out. See .lefthook/pre-push/local-ci.sh.
pre-push:
  scripts:
    "local-ci.sh":
      runner: bash
      use_stdin: true
      env:
        APIM_SIMULATOR_PRE_PUSH_HOOK: "1"
