name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      build_image:
        description: Build the container image after creating the runtime source zip.
        type: boolean
        required: true
        default: true
      image_base:
        description: Base image profile for manual image builds. Tag releases always use dhi.
        type: choice
        required: true
        default: dhi
        options:
          - dhi
          - public
      push_image:
        description: Push the manually built image to GHCR. Tag releases always push.
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/apim-simulator

jobs:
  runtime-source:
    name: Runtime Source Zip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check release tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(
            python - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          PY
          )"
          if [ "${tag_version}" != "${project_version}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match pyproject version ${project_version}" >&2
            exit 1
          fi

      - name: Build runtime source archive
        run: python scripts/build_runtime_artifact.py --output-dir dist

      - name: Upload runtime source archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: apim-simulator-runtime-source
          path: |
            dist/apim-simulator-runtime-*.zip
            dist/apim-simulator-runtime-*.zip.sha256
          if-no-files-found: error

      - name: Attest runtime source archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/apim-simulator-runtime-*.zip

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/apim-simulator-runtime-*.zip dist/apim-simulator-runtime-*.zip.sha256 --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/apim-simulator-runtime-*.zip dist/apim-simulator-runtime-*.zip.sha256 \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi

  image:
    name: GHCR Image
    if: github.event_name != 'workflow_dispatch' || inputs.build_image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: runtime-source
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build runtime image context
        run: |
          set -euo pipefail
          dist_dir="${RUNNER_TEMP}/apim-simulator-dist"
          context_dir="${RUNNER_TEMP}/apim-simulator-runtime-context"
          python scripts/build_runtime_artifact.py --output-dir "${dist_dir}"
          mkdir -p "${context_dir}"
          python - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          dist_dir = Path(os.environ["RUNNER_TEMP"]) / "apim-simulator-dist"
          context_dir = Path(os.environ["RUNNER_TEMP"]) / "apim-simulator-runtime-context"
          archives = sorted(dist_dir.glob("apim-simulator-runtime-*.zip"))
          if len(archives) != 1:
              raise SystemExit(f"expected one runtime archive, found {len(archives)}")

          with zipfile.ZipFile(archives[0]) as archive:
              archive.extractall(context_dir)
          PY

      - name: Resolve image build profile
        id: build-profile
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            image_base="dhi"
            push_image="true"
          else
            image_base="${{ github.event.inputs.image_base || 'dhi' }}"
            push_image="${{ github.event.inputs.push_image || 'false' }}"
          fi

          case "${image_base}" in
            dhi|public)
              ;;
            *)
              echo "Unsupported image_base=${image_base}" >&2
              exit 1
              ;;
          esac

          case "${push_image}" in
            true|false)
              ;;
            *)
              echo "Unsupported push_image=${push_image}" >&2
              exit 1
              ;;
          esac

          {
            echo "image_base=${image_base}"
            echo "push_image=${push_image}"
            echo "build_args<<EOF"
            if [ "${image_base}" = "public" ]; then
              echo "PYTHON_BUILD_IMAGE=python:3.13-slim@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90"
              echo "PYTHON_RUNTIME_IMAGE=python:3.13-slim@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "Image base profile: ${image_base}"
            echo "Push image: ${push_image}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Require Docker Hardened Images credentials
        if: steps.build-profile.outputs.image_base == 'dhi'
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_PASSWORD: ${{ secrets.DHI_TOKEN || secrets.DHI_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${DHI_USERNAME}" ] || [ -z "${DHI_PASSWORD}" ]; then
            echo "Set DHI_USERNAME and DHI_TOKEN (or DHI_PASSWORD) repository secrets before publishing the release image." >&2
            exit 1
          fi

      - name: Log in to Docker Hardened Images
        if: steps.build-profile.outputs.image_base == 'dhi'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN || secrets.DHI_PASSWORD }}

      - name: Verify Docker Hardened Images access
        if: steps.build-profile.outputs.image_base == 'dhi'
        run: |
          set -euo pipefail
          docker buildx imagetools inspect dhi.io/python:3.13-debian13-dev@sha256:ea5fd1cae2463b48c7627577584e582ce3d6d99ba3789723051df9a707f658b0 >/dev/null
          docker buildx imagetools inspect dhi.io/python:3.13-debian13@sha256:1fe1883f0c28d90b7364e6f069437801c9e8f150c886f02f74bfcefc9ea14591 >/dev/null

      - name: Log in to GHCR
        if: steps.build-profile.outputs.push_image == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - name: Build and push GHCR image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ runner.temp }}/apim-simulator-runtime-context
          push: ${{ steps.build-profile.outputs.push_image == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.build-profile.outputs.build_args }}
          provenance: mode=max
          sbom: true

      - name: Attest GHCR image
        if: steps.build-profile.outputs.push_image == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
