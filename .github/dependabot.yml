version: 2

# Every ecosystem waits 7 days after a release before proposing it, matching
# exclude-newer in pyproject.toml and min-release-age in each .npmrc.
#
# Python and npm major versions are upgraded by hand, not by Dependabot: they
# carry breaking changes (mcp is pinned exactly, and @types/node follows the
# Node version the images build on, not the latest).
#
# The DHI images need a Dependabot secret (not an Actions secret) named
# DHI_USERNAME and DHI_TOKEN; without them the dhi.io pins are not updated.
registries:
  dhi:
    type: docker-registry
    url: https://dhi.io
    username: ${{ secrets.DHI_USERNAME }}
    password: ${{ secrets.DHI_TOKEN }}

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"
    labels: ["dependencies", "automated"]

  - package-ecosystem: "npm"
    directories:
      - "/ui"
      - "/examples/portal"
      - "/examples/todo-app/frontend-astro"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"
    labels: ["dependencies", "automated"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
      include: "scope"
    labels: ["dependencies", "automated"]

  # Base images are pinned as tag@digest. A digest bump is a rebuild of the
  # same tag (usually security fixes); a tag bump is a version change.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/ui"
      - "/examples/*"
      - "/examples/todo-app/*"
    registries: ["dhi"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 7
    groups:
      base-images:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
      include: "scope"
    labels: ["dependencies", "automated"]

  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/examples/*"
    registries: ["dhi"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 7
    groups:
      compose-images:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
      include: "scope"
    labels: ["dependencies", "automated"]
