# Enforced owner-test contracts for the documented fidelity subset.
# Historical entries may still use `partial`; new entries should use the
# supported/adapted/unsupported vocabulary documented in
# docs/FIDELITY-CONTRACTS.md.
version: 1
scope: fidelity-subset
taxonomy:
  supported: Documentation-backed behavior for a named local subset.
  adapted: Useful local behavior with an explicitly documented APIM difference.
  unsupported: Outside the project; reject rather than silently approximate.
contracts:
