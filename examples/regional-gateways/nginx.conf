# Stands in for the Traffic Manager name in front of the regional gateways.
# Azure's global URL uses performance routing: DNS returns the healthy regional
# gateway with the lowest latency to the caller. Locally every caller is
# treated as nearest West Europe, and East US is used only while West Europe
# cannot be reached. Unlike Traffic Manager, this proxies the request rather
# than answering a DNS query.
worker_processes 1;

events {
  worker_connections 256;
}

http {
  access_log off;
  upstream regional_gateways {
    server gateway-westeurope:8000 max_fails=1 fail_timeout=5s;
    server gateway-eastus:8000 backup;
  }

  server {
    listen 8000;

    location = /global/health {
      default_type application/json;
      return 200 '{"status":"ok","role":"global"}';
    }

    location / {
      proxy_pass http://regional_gateways;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_connect_timeout 1s;
      # Fail over only when a gateway cannot be reached; a gateway's own
      # 5xx answer is a response, not a regional outage.
      proxy_next_upstream error timeout;
      proxy_next_upstream_tries 2;
    }
  }
}
