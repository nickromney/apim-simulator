events {}
http {
  upstream local_regions {
    server gateway-a:8000 max_fails=1 fail_timeout=2s;
    server gateway-b:8000 max_fails=1 fail_timeout=2s;
  }
  server {
    listen 8443 ssl;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /certs/edge.pem;
    ssl_certificate_key /certs/edge-key.pem;
    ssl_client_certificate /certs/ca.pem;
    ssl_crl /certs/ca.crl.pem;
    ssl_verify_client optional;
    client_max_body_size 8m;
    location / {
      proxy_pass http://local_regions;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
      proxy_set_header X-Client-Cert-Subject "";
      proxy_set_header X-Client-Cert-Issuer "";
      proxy_set_header X-Client-Cert-Thumbprint "";
      proxy_connect_timeout 1s;
      proxy_read_timeout 5s;
      proxy_next_upstream_timeout 3s;
      proxy_next_upstream_tries 2;
      proxy_next_upstream error timeout http_502 http_503 http_504;
    }
  }
}
