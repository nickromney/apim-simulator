name: apim-simulator-architecture-patterns

x-build-args: &build-args
  PYTHON_BUILD_IMAGE: ${PYTHON_BUILD_IMAGE:-dhi.io/python:3.13-debian13-dev}
  PYTHON_RUNTIME_IMAGE: ${PYTHON_RUNTIME_IMAGE:-dhi.io/python:3.13-debian13}
  APP_UID: ${APP_UID:-65532}
  APP_GID: ${APP_GID:-65532}

x-hardening: &hardening
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

services:
  pattern-backends:
    <<: *hardening
    build:
      context: .
      dockerfile: examples/bff/Dockerfile
      args: *build-args
    image: apim-simulator-pattern-backends:local
    command: ["/app/.venv/bin/uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    volumes:
      - ${CURDIR}/backend.py:/app/main.py:ro
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s
    networks: [private]

  order-backend:
    <<: *hardening
    build:
      context: .
      dockerfile: examples/bff/Dockerfile
      args: *build-args
    image: apim-simulator-pattern-backends:local
    command: ["/app/.venv/bin/uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      PATTERN_BACKEND_NAME: order-service
    volumes:
      - ${CURDIR}/backend.py:/app/main.py:ro
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s
    networks: [private]

  apim-simulator:
    <<: *hardening
    build:
      context: .
      dockerfile: Dockerfile
      args: *build-args
    image: apim-simulator:latest
    ports: ["127.0.0.1:${APIM_GATEWAY_PORT:-8000}:8000"]
    environment:
      APIM_CONFIG_PATH: /tmp/architecture-patterns-apim.json
      APIM_CONFIG_SOURCE_PATH: /app/examples/architecture-patterns/apim.json
    depends_on:
      pattern-backends:
        condition: service_healthy
      order-backend:
        condition: service_healthy
    networks: [edge, private]

networks:
  edge:
  private:
    internal: true
