services:
  apim-simulator:
    environment:
      APIM_CONFIG_TRUSTED_PROXY_CIDR: ${APIM_EDGE_PROXY_NETWORK_PREFIX:-10.247.0}.2/32
    networks:
      - edge-ingress

  edge-proxy:
    image: ${EDGE_PROXY_IMAGE:-dhi.io/nginx:1.29.5-debian13@sha256:9683af47feae3bab0031b489ed85f93f340a0f8b83a2edccc9f761dbfce1bffd}
    init: true
    read_only: true
    user: "${NGINX_UID:-101}:${NGINX_GID:-101}"
    depends_on:
      apim-simulator:
        condition: service_started
    ports:
      - "${APIM_BIND_ADDRESS:-127.0.0.1}:${EDGE_HTTP_PORT:-8088}:8088"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=${NGINX_UID:-101},gid=${NGINX_GID:-101},mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,nodev,uid=${NGINX_UID:-101},gid=${NGINX_GID:-101},mode=0755
      - /run/nginx:rw,noexec,nosuid,nodev,uid=${NGINX_UID:-101},gid=${NGINX_GID:-101},mode=0755
      - /var/run:rw,noexec,nosuid,nodev,uid=${NGINX_UID:-101},gid=${NGINX_GID:-101},mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./examples/edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./examples/edge/certs:/etc/nginx/certs:ro
    networks:
      edge-ingress:
        ipv4_address: ${APIM_EDGE_PROXY_NETWORK_PREFIX:-10.247.0}.2

networks:
  edge-ingress:
    ipam:
      config:
        - subnet: ${APIM_EDGE_PROXY_NETWORK_PREFIX:-10.247.0}.0/29
          ip_range: ${APIM_EDGE_PROXY_NETWORK_PREFIX:-10.247.0}.4/30
